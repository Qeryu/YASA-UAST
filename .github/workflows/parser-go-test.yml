name: parser-go

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - name: Vet and test
        working-directory: parser-Go
        run: |
          go vet ./...
          go test ./...
